server:
  port: 8090

spring:
  application:
    name: fan-control-system
  datasource:
    url: jdbc:mysql://localhost:3306/fan_control?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-mysql.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

fancontrol:
  tick:
    enabled: true
    interval-ms: 1000
  alarm:
    threshold: 75.0
